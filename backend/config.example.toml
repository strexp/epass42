# pkd42 backend configuration (optional).
#
# Copy this file to `config.toml`; it is the only configuration source (the
# service reads `./config.toml` by default).

env = "development"
host = "127.0.0.1"
port = 3000
publicUrl = "http://localhost:3000"
# Browser-facing frontend base URL (login redirect + CORS).  Leave empty for a
# same-origin deployment.
frontendUrl = "http://localhost:3001"

# Enabled roles: any subset of ["pkd", "csca", "dsc"].
roles = ["pkd", "csca", "dsc"]

databasePath = "./data/pkd42.db"
runMigrations = true
# Directory for generated artifacts (perso scripts).
dataDir = "./data"

# Minimum 16 characters.  Must be changed for production.
sessionSecret = "change-me-to-a-long-random-secret"
sessionTtlSeconds = 604800
# Set to true behind HTTPS.
cookieSecure = false
logLevel = "info"

# Base64-encoded 32-byte AES-256-GCM key for envelope encryption (M13).
# encryptionKek = "..."

# Trust X-Forwarded-For from a reverse proxy (configure the proxy allowlist).
trustProxy = false

[rateLimit]
max = 120
windowMs = 60000

[smtp]
# url = "smtps://user:pass@smtp.example.net:465"
from = "pkd42 <no-reply@localhost>"

# CSCA (M5): bootstrap a self-signed online CSCA key when none exists.
[csca]
commonName = "pkd42 CSCA"
validityYears = 13
privateKeyUsageYears = 4
keyBits = 4096
hash = "SHA-256"
pss = false
bootstrap = true
crlDistributionPoints = ["ldap://pkd42.local/c=XD"]

[csca.niaDsc]
commonName = "pkd42 NIA DSC"
documentTypes = ["P"]
validityYears = 10
privateKeyUsageYears = 3
keyBits = 2048
pss = false

# CRL scheduling (M6).
[crl]
autoGenerate = true
maxAgeDays = 90
minIntervalHours = 48

# Server-filled issuing fields (M7/M8), editable by NIA DSC admins.
[issuing]
issuingState = "UDN"
issuingAuthority = "NIA"
personalizationDevice = "PKD42"
dg13Policy = "utf8-text"
# Document validity (years); the MRZ expiry is computed by the service.
validityYears = 10
# Maximum DG2 (face) size in bytes (card42 LDS1 DG2 capacity).
dg2MaxBytes = 16384

# LDS2 applications: disabled by default (empty when enabled).  Chip
# Authentication is advertised by LDS2 only (card42's LDS1 is PACE + AA).
[issuing.lds2]
enabled = false
roles = ["travel", "visa", "biometrics"]
caKeyId = 1

[issuing.security]
paceEcdhGm3des = true
paceEcdhGmAes128 = true
aa = false

# dn42 whois used to resolve a client IP to its maintainer(s).  The endpoint
# /dsc/jurisdiction looks up the IP's mnt-by to tell applicants whose
# maintainer uses its own DSC to apply there.
[jurisdiction]
whois = "whois.dn42"
whoisPort = 43
whoisTimeoutMs = 5000

# PKD directory (M9).
[pkd]
# baseDn = "c=XD,dc=data,dc=download,dc=pkd,dc=icao,dc=int"

# Read-only LDAP compatibility layer (M9).
[ldap]
enabled = false
host = "127.0.0.1"
port = 3890

# Administrator maintainers per realm (M4/T4.7).
[adminMnts]
csca = ["EXAMPLE-CSCA-MNT"]
dsc = ["EXAMPLE-DSC-MNT"]
# Also accept any MNT from the identity's `mnt_by`.
adminIncludeMntBy = false

# OAuth/OIDC providers.  The `dn42` claim carries the ASN and maintainer data.
[[oauthProviders]]
realm = "csca"
issuer = "https://auth.example.net"
clientId = "pkd42-csca"
clientSecret = "replace-me"
# Short login-method alias (defaults to the issuer host); shown in the UI and
# used in the callback URL.
alias = "auth"
scopes = ["openid", "profile", "email", "dn42"]
enabled = true

[oauthProviders.claimMap]
dn42 = "dn42"

[[oauthProviders]]
realm = "dsc"
issuer = "https://auth.example.net"
clientId = "pkd42-dsc"
clientSecret = "replace-me"
alias = "auth"
scopes = ["openid", "profile", "email", "dn42"]
enabled = true

[oauthProviders.claimMap]
dn42 = "dn42"
