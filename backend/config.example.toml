# ============================================================================
# ePass 42 backend configuration
# ============================================================================
# Copy this file to `config.toml`; it is the only configuration source (the
# service reads `./config.toml` by default).  Options are grouped by the role
# or function that owns them:
#
#   Shared            server, sessions, limits, access control
#   Directory   pkd   published certificates / CRLs and the LDAP layer
#   Signing CA  csca  CSCA and its system NIA Document Signer certificate
#   Verifying CA cvca CVCA key, authorization and Document Verifier defaults
#   Terminal    dv    terminal certificate applications (uses cvca settings)
#   Perso.      dsc   issuing fields, LDS2 and security mechanisms
#   Login             OAuth/OIDC providers, one per realm
#
# A role's section is only read when that role is listed in `roles` below.

# ============================================================================
# Shared — server, sessions, limits
# ============================================================================
env = "development"
host = "127.0.0.1"
port = 3000
publicUrl = "http://localhost:3000"
# Browser-facing frontend base URL (login redirect + CORS).  Leave empty for a
# same-origin deployment.
frontendUrl = "http://localhost:3001"

# Country codes: alpha-2 for DN/PKD paths and alpha-3 for the MRZ and the
# CSCA SAN locality.  These are the single source of truth for the country.
countryAlpha2 = "XD"
countryAlpha3 = "XDN"

# Enabled roles: any subset of ["pkd", "csca", "cvca", "dv", "dsc"].
roles = ["pkd", "csca", "cvca", "dv", "dsc"]

databasePath = "./data/epass42.db"
runMigrations = true
# Directory for generated artifacts (perso scripts).
dataDir = "./data"

# Minimum 16 characters.  Must be changed for production.
sessionSecret = "change-me-to-a-long-random-secret"
sessionTtlSeconds = 604800
# Set to true behind HTTPS.
cookieSecure = false
logLevel = "info"

# Base64-encoded 32-byte AES-256-GCM key for envelope encryption (M13).
# encryptionKek = "..."

# Trusted reverse proxies for X-Forwarded-For / X-Forwarded-Proto: a list of
# IPs/CIDRs, or `true` to trust every peer, or `false` to trust none.  The
# default trusts loopback (127.0.0.1 / ::1), where a same-host proxy connects
# from; set `true` only if the proxy address cannot be pinned down and the
# service is not directly reachable.
trustProxy = ["127.0.0.1", "::1"]

# Requests per client IP and window.
[rateLimit]
max = 120
windowMs = 60000

# Outgoing email (delivery links and notifications).
[smtp]
# url = "smtps://user:pass@smtp.example.net:465"
from = "ePass 42 <no-reply@localhost>"

# ============================================================================
# Shared — access control
# ============================================================================
# Administrator maintainers per realm (M4/T4.7).
[adminMnts]
csca = ["EXAMPLE-CSCA-MNT"]
cvca = ["EXAMPLE-CVCA-MNT"]
dv = ["EXAMPLE-DV-MNT"]
dsc = ["EXAMPLE-DSC-MNT"]
# Also accept any MNT from the identity's `mnt_by`.
adminIncludeMntBy = false

# ============================================================================
# Directory — role `pkd`
# ============================================================================
# PKD directory (M9): published certificates, CRLs, revoked documents and the
# public browse/download endpoints.
[pkd]
# baseDn = "c=XD,dc=data,dc=download,dc=pkd,dc=icao,dc=int"

# Read-only LDAP compatibility layer (M9).
[ldap]
enabled = false
host = "127.0.0.1"
port = 3890

# ============================================================================
# Signing CA — role `csca`
# ============================================================================
# CSCA (M5): bootstrap a self-signed online CSCA key when none exists.  Enable
# with `roles = [..., "csca"]`.
[csca]
commonName = "ePass 42 CSCA"
# Organisation (O) placed in the CSCA/DSC subject names (kept identical across
# both, matching common ICAO PKD practice).  Set the NIA/issuing authority.
organization = "ePass 42"
# Optional organisational unit (OU) in the subject names; leave unset to omit.
organizationalUnit = "ePass 42 PKI"
# Key algorithm: "rsa" or "ecdsa" (Doc 9303-12 §4.1.5).  Curve for ecdsa.
algorithm = "rsa"
curve = "P-256"
validityYears = 13
privateKeyUsageYears = 4
keyBits = 4096
hash = "SHA-256"
pss = false
bootstrap = true
crlDistributionPoints = ["ldap://epass42.local/c=XD"]

# The system NIA Document Signer certificate issued at startup.
[csca.niaDsc]
commonName = "ePass 42 NIA DSC"
# Authorized document types (Doc 9303-12 §7.1.1): "P" is a TD3 passport,
# "ID"/"IP" are TD1 identity/passport cards and "I" authorizes every I* type.
# The default lets one built-in DSC sign both passports and ID-1 documents.
documentTypes = ["P", "I"]
# The DSC key algorithm may differ from the CSCA's (Doc 9303-12 §4.1.5).
algorithm = "rsa"
curve = "P-256"
validityYears = 10
privateKeyUsageYears = 3
keyBits = 2048
pss = false
hash = "SHA-256"

# Certificate Revocation List scheduling (M6).
[crl]
autoGenerate = true
maxAgeDays = 90
minIntervalHours = 48

# ============================================================================
# Verifying CA — role `cvca`
# ============================================================================
# CVCA (M17, Doc 9303-12 §7.2): the LDS2 authorization-PKI trust anchor.  It
# issues card-verifiable Document Verifier (DV) certificates and provides the
# Terminal Authentication trust point.  Enable with `roles = [..., "cvca"]`.
[cvca]
commonName = "ePass 42 CVCA"
# Holder mnemonic used in the CVCA Certificate Holder Reference (max 9 chars).
holderMnemonic = "CVCA"
# Key algorithm: "ecdsa" (P-256, required for Terminal Authentication) or "rsa".
algorithm = "ecdsa"
# CVCA public key validity in months (the profile caps it at 3 years).
validityMonths = 36
keyBits = 2048
hash = "SHA-256"
pss = false
bootstrap = true

# The authorization the CVCA grants (its certificate and the trust point).
[cvca.authorization]
epassport = { dg3 = true, dg4 = true }
travel = { read = true, write = true }
visa = { read = true, write = true }
biometrics = { read = true, write = true }

# Document Verifier certificates issued by the CVCA.
[cvca.dv]
# DV public key validity in days (the profile caps it at 3 months).
validityDays = 90
keyBits = 2048
pss = false

# Default authorization offered in the DV application form.
[cvca.dv.defaultPermissions]
epassport = { dg3 = true, dg4 = true }
travel = { read = true, write = false }
visa = { read = true, write = false }
biometrics = { read = false, write = false }

# The CVCA-issued default ("system") DV that maintainers may delegate to.
[cvca.dv.defaultDv]
# commonName = "..."   # defaults to "<cvca.commonName> Default DV"
holderMnemonic = "NIADV"

# ============================================================================
# Terminal certificates — role `dv`
# ============================================================================
# The DV realm (path /dv) lets Document Verifier holders apply for terminal
# (Inspection System) certificates.  It has no dedicated options: applications
# are signed by the DV resolved from [cvca.dv] and the maintainer's delegation.
# Enable with `roles = [..., "dv"]`.

# ============================================================================
# Personalization — role `dsc`
# ============================================================================
# Server-filled issuing fields (M7/M8), editable by NIA DSC admins.  Enable
# with `roles = [..., "dsc"]`.
[issuing]
issuingAuthority = "NIA"
personalizationDevice = "EPASS42"
dg13Policy = "utf8-text"
# Document validity (years); the MRZ expiry is computed by the service.
validityYears = 10
# Maximum DG2 (face) size in bytes (card42 LDS1 DG2 capacity).
dg2MaxBytes = 16384

# LDS2 applications: disabled by default (empty when enabled).  Chip
# Authentication material lives in the master file and is shared by LDS1 and
# the LDS2 applications.  Every emitted application also gets its read/write
# authorization opened on the CVCA trust point (DGI FF07): the card ANDs the
# trust point with the terminal certificate, so zero bits make it unreadable
# (6982) no matter what the terminal certificate carries.
[issuing.lds2]
enabled = false
roles = ["travel", "visa", "biometrics"]

[issuing.security.pace]
# PACE ECDH-GM profiles shared by LDS1 and LDS2 (at least one must stay on).
ecdhGm3des = true
ecdhGmAes128 = true

[issuing.security.aa]
# Active Authentication (LDS1 only).  Algorithms: rsaSha1 | rsaSha256 | ecdsa.
enabled = false
algorithm = "rsaSha1"

[issuing.security.ca]
# Chip Authentication shared by LDS1 and LDS2 (forced on when LDS2 is emitted).
# card42 advertises both ECDH 3DES and AES-128; the terminal picks.
enabled = false
keyId = 1

[issuing.security.ta]
# Terminal Authentication: personalize a CVCA trust point and advertise id-TA.
# Requires a running CVCA with an "ecdsa" key (see [cvca]).  The ICC current
# date (DGI FF08) is always the personalization date.
enabled = false
# Base trust-point authorization; defaults to the CVCA's [cvca.authorization].
# Applications emitted through [issuing.lds2] are always authorized here, even
# when this section (or the CVCA grant) leaves them at zero.  Its unique effect
# is the LDS1 ePassport byte (DG3/DG4), which the card also gates on the trust
# point.
# [issuing.security.ta.authorization]
# epassport = { dg3 = true, dg4 = true }

# dn42 whois used to resolve a client IP to its maintainer(s).  The endpoint
# /dsc/jurisdiction looks up the IP's mnt-by to tell applicants whose
# maintainer uses its own DSC to apply there.
[jurisdiction]
whois = "whois.dn42"
whoisPort = 43
# Total (and idle) timeout per whois query.
whoisTimeoutMs = 5000
# IP→MNT answer cache: TTL and maximum entries (LRU eviction).
whoisCacheTtlMs = 300000
whoisCacheMaxEntries = 1024

# ============================================================================
# Login — OAuth/OIDC providers, one per realm
# ============================================================================
# The `dn42` claim carries the ASN and maintainer data.  A realm may list more
# than one provider; the `alias` names the login method in the UI.
[[oauthProviders]]
realm = "csca"
issuer = "https://auth.example.net"
clientId = "epass42-csca"
clientSecret = "replace-me"
# Short login-method alias (defaults to the issuer host); shown in the UI and
# used in the callback URL.
alias = "auth"
scopes = ["openid", "profile", "email", "dn42"]
enabled = true

[oauthProviders.claimMap]
dn42 = "dn42"

# Verification realm (maintainers applying for DV certificates).
[[oauthProviders]]
realm = "cvca"
issuer = "https://auth.example.net"
clientId = "epass42-cvca"
clientSecret = "replace-me"
alias = "auth"
scopes = ["openid", "profile", "email", "dn42"]
enabled = true

[oauthProviders.claimMap]
dn42 = "dn42"

# Terminal realm (Document Verifier holders applying for terminal certificates).
[[oauthProviders]]
realm = "dv"
issuer = "https://auth.example.net"
clientId = "epass42-dv"
clientSecret = "replace-me"
alias = "auth"
scopes = ["openid", "profile", "email", "dn42"]
enabled = true

[oauthProviders.claimMap]
dn42 = "dn42"

# Personalization realm (issuing organisations).
[[oauthProviders]]
realm = "dsc"
issuer = "https://auth.example.net"
clientId = "epass42-dsc"
clientSecret = "replace-me"
alias = "auth"
scopes = ["openid", "profile", "email", "dn42"]
enabled = true

[oauthProviders.claimMap]
dn42 = "dn42"
