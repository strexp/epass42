name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Superseded runs on the same ref are cancelled, so the newest commit always
# wins when several pushes land close together.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck

  # Unit tests for the library, backend and frontend.  The e2e suite has its own
  # matrix below so a failure is reported against the scenario group.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (all packages except the e2e suite)
        run: pnpm -r --filter '!@epass42/scripts' test

  # The e2e suites run one job per scenario group: the pure-PKI package suite and
  # the real-HTTP backend suite.  Both boot no external service (SQLite in
  # memory, fake OIDC), so they are safe on hosted runners.
  #
  # card42's cross-project suite is intentionally not part of this matrix: it
  # needs a separate card42 checkout plus the Oracle Java Card simulator.  It is
  # skipped by default; run it locally with
  #   pnpm --filter @epass42/scripts test:card42
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [packages, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: E2E — ${{ matrix.suite }}
        run: pnpm --filter @epass42/scripts test:${{ matrix.suite }}

  build:
    needs: [check, unit, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build backend (dist)
        run: pnpm --filter @epass42/backend build
      - name: Build frontend (static SPA)
        env:
          # Runtime-substituted placeholder; see frontend/Dockerfile.
          NUXT_PUBLIC_API_BASE: __EPASS42_API_BASE__
        run: pnpm --filter @epass42/frontend generate
      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: epass42-backend
          path: backend/dist
          if-no-files-found: error
          retention-days: 14
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: epass42-frontend
          path: frontend/.output/public
          if-no-files-found: error
          retention-days: 14

  # Confirm this commit is still the head of the default branch: a newer push may
  # have landed while the checks and build ran.
  head:
    needs: [check, unit, e2e, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.check.outputs.is_latest }}
    steps:
      - name: Check the branch head
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha')"
          if [ "$head_sha" = "${GITHUB_SHA}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_SHA} is no longer the head of ${GITHUB_REF_NAME}; skipping image publish."
          fi

  # Publish both images (linux/amd64 + linux/arm64) as `latest`, but only once
  # checks and the build have passed and this is still the branch head.
  docker:
    needs: [check, unit, e2e, build, head]
    if: needs.head.outputs.is_latest == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      tags: |
        type=raw,value=latest
