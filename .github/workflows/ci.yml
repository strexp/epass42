name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: M2 script check (generate CSCA and verify it)
        env:
          PKD42_KEY_PASSPHRASE: ci-passphrase
        run: |
          pnpm --filter @pkd42/scripts exec tsx src/gen-csca.ts \
            --out "$RUNNER_TEMP/csca" --cn "pkd42 CI CSCA" --key-rsa-bits 2048
          pnpm --filter @pkd42/scripts exec tsx src/verify.ts \
            cert "$RUNNER_TEMP/csca/csca.crt" --kind csca
