name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Superseded runs on the same ref are cancelled, so the newest commit always
# wins when several pushes land close together.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: M2 script check (generate CSCA and verify it)
        env:
          EPASS42_KEY_PASSPHRASE: ci-passphrase
        run: |
          pnpm --filter @epass42/scripts exec tsx src/gen-csca.ts \
            --out "$RUNNER_TEMP/csca" --cn "ePass 42 CI CSCA" --key-rsa-bits 2048
          pnpm --filter @epass42/scripts exec tsx src/verify.ts \
            cert "$RUNNER_TEMP/csca/csca.crt" --kind csca

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build backend (dist)
        run: pnpm --filter @epass42/backend build
      - name: Build frontend (static SPA)
        env:
          # Runtime-substituted placeholder; see frontend/Dockerfile.
          NUXT_PUBLIC_API_BASE: __EPASS42_API_BASE__
        run: pnpm --filter @epass42/frontend generate
      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: epass42-backend
          path: backend/dist
          if-no-files-found: error
          retention-days: 14
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: epass42-frontend
          path: frontend/.output/public
          if-no-files-found: error
          retention-days: 14

  # Publish the default-branch images as `latest`, but only once checks and the
  # build below have passed *and* this commit is still the branch head.
  docker:
    needs: [check, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to ghcr.io
    env:
      REGISTRY: ghcr.io
    strategy:
      matrix:
        include:
          - name: frontend
            dockerfile: frontend/Dockerfile
          - name: backend
            dockerfile: backend/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Check this is the latest commit on the branch
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha')"
          if [ "$head_sha" = "${GITHUB_SHA}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_SHA} is no longer the head of ${GITHUB_REF_NAME}; skipping image publish."
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.head.outputs.is_latest == 'true'
      - name: Lowercase the owner for the image name
        if: steps.head.outputs.is_latest == 'true'
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        if: steps.head.outputs.is_latest == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: steps.head.outputs.is_latest == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/epass42-${{ matrix.name }}
          tags: |
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        if: steps.head.outputs.is_latest == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_PUBLIC_API_BASE=__EPASS42_API_BASE__
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
